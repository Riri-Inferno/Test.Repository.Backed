services:
  db:
    image: postgres:16
    container_name: develop-db-test
    environment:
      POSTGRES_USER: postgre
      POSTGRES_PASSWORD: battlefieldfixer
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
